services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NUXT_DATABASE_URL: ${DATABASE_URL}
      NUXT_PUBLIC_DEMO_PANEL: ${NUXT_PUBLIC_DEMO_PANEL:-true}
    ports:
      - "127.0.0.1:${APP_PORT:-8120}:3000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: paywall
      POSTGRES_DB: paywall
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paywall -d paywall"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
